name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Build
      shell: cmd
      run: build.bat

    - name: Stage artifact
      shell: cmd
      run: mkdir dist\BatteryTray && copy /y build\BatteryTray.exe dist\BatteryTray\

    - name: Upload to Artifact
      uses: actions/upload-artifact@v7
      with:
        name: BatteryTray
        path: dist\*
        if-no-files-found: error
