name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Resolve version
      shell: pwsh
      run: |
        $version = if ($env:GITHUB_REF_TYPE -eq 'tag') {
          $env:GITHUB_REF_NAME -replace '^v', ''
        } else {
          $describe = $null
          try { $describe = git describe --tags --long --match "v*.*.*" 2>$null } catch { }
          $global:LASTEXITCODE = 0
          if ($describe) { $describe -replace '^v', '' -replace '-g[0-9a-f]+$', '' } else { '0.0.0-0' }
        }
        Write-Host "Version: $version"
        "VERSION=$version" >> $env:GITHUB_ENV

    - name: Build
      shell: cmd
      run: build.bat

    - name: Stage artifact
      shell: cmd
      run: mkdir dist\BatteryTray && copy /y build\BatteryTray.exe dist\BatteryTray\

    - name: Upload to Artifact
      uses: actions/upload-artifact@v7
      with:
        name: BatteryTray
        path: dist\*
        if-no-files-found: error

    - name: Package release archive
      if: startsWith(github.ref, 'refs/tags/v')
      shell: pwsh
      run: Compress-Archive -Path dist/BatteryTray -DestinationPath BatteryTray.zip

    - name: Publish release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v3
      with:
        files: BatteryTray.zip
