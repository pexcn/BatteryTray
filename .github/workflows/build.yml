name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Build
      shell: cmd
      run: call build.bat || exit /b 1

    - name: Upload to Artifact
      uses: actions/upload-artifact@v7
      with:
        name: percentage
        path: build\percentage.exe
        if-no-files-found: error
