name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Resolve version
      shell: pwsh
      run: |
        $version = if ($env:GITHUB_REF_TYPE -eq 'tag') {
          $env:GITHUB_REF_NAME -replace '^v', ''
        } else {
          $describe = & { $ErrorActionPreference = 'Continue'; git describe --tags --long --match "v*.*.*" 2>$null }
          if ($describe) { $describe -replace '^v', '' -replace '-g[0-9a-f]+$', '' } else { '0.0.0-0' }
        }
        Write-Host "Version: $version"
        "VERSION=$version" >> $env:GITHUB_ENV

    - name: Build
      shell: cmd
      run: build.bat

    - name: Stage artifact
      shell: cmd
      run: mkdir dist\BatteryTray && copy /y build\BatteryTray.exe dist\BatteryTray\

    - name: Upload to Artifact
      uses: actions/upload-artifact@v7
      with:
        name: BatteryTray
        path: dist\*
        if-no-files-found: error
